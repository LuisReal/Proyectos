<html>

<head>

    <script>
        window.addEventListener('pageshow', function(event) {
            if (!localStorage.getItem('usuario')) {
                // Si no hay sesión, redirige inmediatamente
                location.replace("../index.html");
            } 
        });
    </script>

    <link href="../css/administrador.css" rel="stylesheet">
    <link href="../css/navbar.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


<body>


    <div class="global-container">
        <button id="btn-open-menu" class="btn-open-navbar"><i class="bi bi-list"></i></button>

        <div class="banner-izquierdo" id="banner-izquierdo">

            <button id="btn-close-menu" class="btn-close-navbar"><i class="bi bi-x-square"></i></button>
            <label class="foto-perfil"></label>


            <div class="botones-container">

                <h1 id="usuario" class="nombre-usuario"></h1>

                <button onclick="mostrarCanciones()" type="button" class="btn-pagina-principal">Pagina
                    Principal</button>
                <button type="button" onclick="Perfil()" class="btn-mi-perfil">Mi Perfil</button>
                <button type="button" id="lola" onclick="mostrarUsuarios()" class="btn-usuarios">Usuarios</button>
                <button type="button" onclick="mostrarComentarios()" class="btn-comentarios">Comentarios</button>
                <button onclick="cargarCanciones()" type="button" class="btn-cargar-canciones">Cargar Canciones</button>
                <button onclick="mostrarSolicitudes()" type="button" class="btn-solicitudes">Solicitudes</button>
                <button onclick="Back()" type="button" class="boton-back">Back</button>

            </div>
            <button href="javascript:cerrar()" onclick="cerrarSesion()" type="button" class="boton-cerrarSesion">Cerrar
                Sesion</button>

        </div>

        <div class="info-container">

            <p class="canciones_disponibles">Canciones Disponibles</p>

            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nombre</th>
                        <th>Imagen</th>
                        <th>Modificar</th>

                        <th>comentarios</th>
                    </tr>
                </thead>
                <tbody class="tbody" id="tbody">

                </tbody>
            </table>


        </div>

    </div>


    <script>
        function cerrarSesion() {
            localStorage.removeItem('usuario');

            window.location.href = "../index.html";
        }



        fetch('http://192.168.0.10:8000/Admin',  //3.129.19.112

        ).then(response => response.json()
        ).catch(err => {
            console.log("no se pudo consumir la api")
        }).then(res => {
            console.log(res)


            var valor = res.admin // Proviene de ModificarPerfilAdministrador.html (Modificar()) 

            var h1 = document.querySelector('#usuario')
            h1.innerHTML +=
                `
                        <h1>${valor}</h1>
                        
                        `
        })



        function Perfil() {
            fetch('http://192.168.0.10:8000/Admin', // proviene de administrador.html

            ).then(response => response.json()
            ).catch(err => {
                console.log("no se pudo consumir la api")
            }).then(res => {
                console.log(res)

                var admi = res.admin // se envia a ModificarPerfilAdministrador
                localStorage.setItem("usuario", admi) // se envia a ModificarPerfilAdministrador

                location.href = "ModificarPerfilAdministrador.html"

            })

        }

        fetch('http://192.168.0.10:8000/Canciones',

        ).then(response => response.json()
        ).catch(err => {
            console.log("no se pudo consumir la api")
        }).then(res => {
            console.log(res)
            for (i = 0; i < (res.length); i++) {
                console.log(res[i])
                var tbody = document.querySelector('#tbody')
                tbody.innerHTML +=
                    `
                    <tr >
                        <td>${res[i].id}</td>
                        <td>${res[i].nombre}</td>
                        <td><img src="${res[i].imagen}" height="200" width="200"></td>
                        <td><button type="button" value="${res[i].id}"  onclick="modificarCancion(this)" class="boton-modificar">Modificar</button></td>

                        <td><button type="button" value="${res[i].id}"  onclick="verComentarios(this)" class="boton-comentario">Ver Comentarios</button></td>
                    </tr>
                    `
            }
        })

        function cargarCanciones() {
            location.href = "Canciones.html"
        }
    </script>

    <script>

        function Back() {
            location.href = "../index.html"
        }

        function mostrarSolicitudes() {
            location.href = "MostrarSolicitudes.html"
        }

        function verComentarios(boton) {
            var id = boton.value
            localStorage.setItem("id", id) // se envia a AdminComentarios.html
            location.href = "ComentariosCancion.html"
        }

        function mostrarComentarios() {
            location.href = "AdminComentarios.html"
        }

        function mostrarUsuarios() {

            location.href = "tablaUsuarios.html"
        }
    </script>

    <script>

        function eliminarCancion(boton) {

            var id = boton.value

            var objeto = {
                'id': id
            }

            fetch(`http://192.168.0.10:8000/Canciones/${id}`, {


                method: 'DELETE',
                body: JSON.stringify(objeto),
                headers: {
                    'Content-Type': 'application/json'
                }
            }).then(response => response.json()
            ).catch(err => {
                console.log("no se pudo consumir la api")
            }).then(res => {
                console.log(res.message)

                alert("La cancion fue eliminada exitosamente")

            })
        }

        function modificarCancion(boton) { // proviene de mostrarCanciones()

            var id = boton.value // se recibe el id de la cancion (int)
            localStorage.setItem("buscar", id) //guarda el id en la clase buscar

            location.href = "ModificarCancion.html"

        }

    </script>

    <script>
        const open_menu = document.getElementById("btn-open-menu");
        const close_menu = document.getElementById("btn-close-menu");
        const navbar = document.getElementById("banner-izquierdo");


        open_menu.addEventListener("click", () => {
            console.log("hiciste click en abrir menu");
            navbar.classList.add("visible");
        });

        close_menu.addEventListener("click", () => {
            console.log("hiciste click en cerrar menu");
            navbar.classList.remove("visible");
        });

    </script>
</body>

</html>
