
{% load static %}
<html>
<head>
    <title>Paises</title>
    
    <link rel="stylesheet" type="text/css" href={% static 'bootstrap/css/bootstrap.min.css'%} /> 
    <link rel="stylesheet" type="text/css" href={% static 'estilos.css'%} />
    
</head>
<body >

    <form method= "POST" >
        {% csrf_token %}
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="http://localhost:8000/">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav move">
                    
                    <li class="nav-item">
                        <button type="submit" name="ver" class="btn btn-success py-3" value="Ver discos">Ver Discos</button>
                        <!--<input type="submit" name="ver" class="btn btn-success py-3" value="Ver Empleados">-->
                    </li>


                    <li>
                        <div class="btn-group">
                            <button type="submit" name="buscar" class="btn btn-primary dropdown-toggle py-3" data-bs-toggle="dropdown" aria-expanded="false" value="Buscar">Buscar</button>
                            <ul class="dropdown-menu">   
                                <li><input class="dropdown-item" type="submit" name="titulo" value="Titulo"></li>
                                <li><input class="dropdown-item" type="submit" name="year" value="Year"></li>
                                <li><input class="dropdown-item" type="submit" name="artista" value="Artista"></li>
                            </ul>
                        </div>
                    </li>

                    <li class="nav-item "><!--Agregar value="Modificar" al boton Modificar para que funcione"-->
                        <button type="submit" name="modificar" class="btn btn-warning py-3" value="Modificar">Modificar</button>
                        
                    </li>
                    <li class="nav-item "><!--Agregar value="Eliminar" al boton eliminar para que funcione"-->
                        <button type="submit" name="eliminado" class="btn btn-danger py-3" value="Eliminar" >Eliminar</button>
                    </li>
                    <li class="nav-item ">
                        <button type="submit" name="reporte" class="btn btn-info py-3" value="Reporte" >Reporte</button>
                    </li>
                </ul>
                </div>
            </div>
        </nav>

        <div class="container my-3 bg">
            
            <div class="row">
                <div class="col-sm-12 col-md-6 col-lg-6 col-xl-4 py-4 ">
                    <div id="datos">
                        <h3>Discos</h3>
                        <textarea>{% for cd in data.catalog.cd %}
Title: {{cd.title}}
Artist: {{cd.artist}}
Company: {{cd.company}} 
Country: {{cd.country}}
Price: {{cd.price}}
Year: {{cd.year}}
{% endfor %}
                        </textarea>
                    </div>
                </div>
                <div class="col-sm-12 col-md-6 col-lg-6 col-xl-4 py-4 ">
                    <div id="busqueda" >
                        <h3>Busqueda de Discos</h3>
                        <input type="text" name="texto">
        
                        <table class="table table-bordered table-success table-striped table-hover my-2">
                            
                            <thead class="table-dark">
                                <tr>
                                    <th class="centrado">Title</th>
            
                                    <th class="centrado">Artist</th>
            
                                    <th class="centrado">Company</th>
            
                                    <th class="centrado">Country</th>

                                    <th class="centrado">Price</th>

                                    <th class="centrado">Year</th>
                                </tr>
                                
                            </thead>
                               
                            <tbody>
                                {% for cd in datos.catalog.cd %}
    
                                    <tr>    
                                        <td class="centrado">{{cd.title}}</td>
                                        <td class="centrado">{{cd.artist}}</td>
                                        <td class="centrado">{{cd.company}}</td>
                                        <td class="centrado">{{cd.country}}</td>
                                        <td class="centrado">{{cd.price}}</td>
                                        <td class="centrado">{{cd.year}}</td>
                                    </tr>
                                            
                                {% endfor %}
                            </tbody>       
                        </table>
                    </div>

                </div>
                <div class="col-sm-12 col-md-3 col-lg-3 col-xl-4 py-4  px-4">
                    <div >
                        <h3>Eliminar Disco</h3>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">
                                <img  src="{% static 'id.png' %}"  width="20" height="20">
                            </span>
                            <input type="text" name="elim" class="form-control" placeholder="Introduzca Titulo" aria-label="Username" aria-describedby="basic-addon1">
                        </div>
                        
                        <h3>Modificar Disco</h3>
                        
                        <label>titulo</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">
                                <img  src="{% static 'discos.png' %}"  width="20" height="20">
                            </span>
                            <input type="text" name="titulo1" class="form-control" placeholder="Titulo" aria-label="Username" aria-describedby="basic-addon1">
                        </div>
                        
                        <label>artista</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">
                                <img  src="{% static 'cantante.png' %}"  width="20" height="20">
                            </span>
                            <input type="text" name="artista1" class="form-control" placeholder="Artista" aria-label="Username" aria-describedby="basic-addon1">
                        </div>
                        
                        
                        <label>pais</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">
                                <img  src="{% static 'pais.png' %}"  width="20" height="20">
                            </span>
                            <input type="text" name="pais1" class="form-control" placeholder="Pais" aria-label="Username" aria-describedby="basic-addon1">
                        </div>

                        <label>compania</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">
                                <img  src="{% static 'company.png' %}"  width="20" height="20">
                            </span>
                            <input type="text" name="compania1" class="form-control" placeholder="Compania" aria-label="Username" aria-describedby="basic-addon1">
                        </div>

                        <label>precio</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">
                                <img  src="{% static 'salario.png' %}"  width="20" height="20">
                            </span>
                            <input type="text" name="precio1" class="form-control" placeholder="Precio" aria-label="Username" aria-describedby="basic-addon1">
                        </div>

                        <label>año</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1">
                                <img  src="{% static 'calendario.png' %}"  width="20" height="20">
                            </span>
                            <input type="text" name="anio1" class="form-control" placeholder="Año" aria-label="Username" aria-describedby="basic-addon1">
                        </div>
                        
                    </div>
                </div>
                
            </div>
            
        </div>
        
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
