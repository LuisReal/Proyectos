
<html>
<head>
    <title>Javascript</title>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
    
    
</head>
<body>
    <form method = "POST">
        {% csrf_token %}
        
        <!--TABLA QUE MUESTRA LOS DATOS-->
        <div id="busqueda" >
                            
            <h3>Busqueda de Paises</h3>
            <input type="text" name="paises">
            
            <table class="table table-bordered table-success table-striped table-hover my-2">
                
                <thead class="table-dark">
                    <tr>
                        <th class="centrado">Pais</th>

                        <th class="centrado">Capital</th>

                        <th class="centrado">Idioma</th>

                        <th class="centrado">Continente</th>
                        
                    </tr>
                    
                </thead>
                    
                <tbody>
                    {% for continente in datos.mundo.continente %}

                        {% for pais in continente.pais %} 
                                
                            <tr>
                                        
                                <td class="centrado">{{pais.nombre}}</td>

                                <td class="centrado">{{pais.capital}}</td>

                                <td class="centrado">{{pais.idioma}}</td>
                                        
                                <td class="centrado">{{continente.continente}}</td>
                            </tr>
                                
                        {% endfor %}
                    {% endfor %}
                </tbody>       
            </table>
            
        </div>
        <!--FIN DE TABLA -->
    
        <button type="submit" id="myMoneda" value="moneda" class="btn btn-info btn-lg" >Moneda</button>
    
    </form>

    <script> //Importante colocar el codigo aca para que el modal lo muestre correctamente(por el orden de ejecucion)
        $(function(){
            var n = '{{datos.mensaje}}';
            if(n === 'False'){
                $('#myModal').modal('show');
            }
        });
    </script>

    <!--CODIGO DEL MODAL DE BOOTSTRAP -->
    
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">Resultado</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              No se encontro el dato
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              
            </div>
          </div>
        </div>
    </div>
    
    <!--FIN DEL MODAL -->
    
    
</body>
</html>
